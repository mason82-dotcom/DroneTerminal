name: One-time OpenFlightHub API import
on:
  push:
    branches:
      - feat/import-openflighthub-web-app-20261108
    paths:
      - .github/workflows/import-openflighthub-api-once.yml
permissions:
  contents: write
jobs:
  import:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Import exact API archive and remove bootstrap
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --location --silent --show-error --retry 3 \
            "https://api.github.com/repos/OpenFlightHub/api/zipball/903019755143799cfe528eeb1960a1f52776cb27" \
            --output "$RUNNER_TEMP/openflighthub-api.zip"
          python3 - <<'PY'
          import os, shutil, subprocess, zipfile
          from pathlib import Path, PurePosixPath
          
          archive=Path(os.environ["RUNNER_TEMP"])/"openflighthub-api.zip"
          source=Path(os.environ["RUNNER_TEMP"])/"droneterminal-api-verified"
          dest=Path("services/api/upstream")
          source.mkdir(parents=True,exist_ok=False)
          count=total=0
          with zipfile.ZipFile(archive) as z:
              for entry in z.infolist():
                  if entry.is_dir(): continue
                  parts=PurePosixPath(entry.filename).parts
                  if len(parts)<2 or any(p in ("", ".", "..") for p in parts):
                      raise RuntimeError("Unexpected ZIP path: "+entry.filename)
                  if ((entry.external_attr>>16)&0o170000) not in (0,0o100000):
                      raise RuntimeError("Unexpected ZIP file type: "+entry.filename)
                  dst=source.joinpath(*parts[1:])
                  dst.parent.mkdir(parents=True,exist_ok=True)
                  dst.write_bytes(z.read(entry))
                  count+=1
                  total+=entry.file_size
          if (count,total)!=(155,31191444):
              raise RuntimeError(f"Unexpected inventory: {count} files; {total} bytes")
          subprocess.run(["git","init","-q",str(source)],check=True)
          subprocess.run(["git","-C",str(source),"add","-A"],check=True)
          tree=subprocess.check_output(["git","-C",str(source),"write-tree"],text=True).strip()
          if tree!="9239f39b6b54cba8da14ad717e3c6fb2ae5d1158":
              raise RuntimeError("ZIP differs from user-supplied verified archive: "+tree)
          shutil.rmtree(source/".git")
          if dest.exists(): raise RuntimeError("API destination already exists: "+str(dest))
          dest.parent.mkdir(parents=True,exist_ok=True)
          shutil.copytree(source,dest)
          Path("docs/api-import.md").write_text("""# API-Import: OpenFlightHub zu DroneTerminal
          
          ## Herkunft und Prüfnachweis
          
          - Nutzerarchiv: api-master.zip
          - Upstream: https://github.com/OpenFlightHub/api
          - Fixierter Commit: 903019755143799cfe528eeb1960a1f52776cb27
          - Git-Tree: 9239f39b6b54cba8da14ad717e3c6fb2ae5d1158
          - Verzeichnis: services/api/upstream/
          - Dateien: 155, einschließlich fünf großer Test-/Beispielbilder
          - Umfang: 31.191.444 Byte
          - Validierung: Git-Tree byteidentisch mit Nutzerarchiv; inklusive Dateinamen, Dateimodi und Originalbaum.
          
          ## Module
          
          Express/TypeScript-REST-API, WebSocket, MongoDB-unabhängiges
          PostgreSQL/pg-promise-ORM, DJI-Pilot-2-MQTT-Connector, Flug-/Geräte-/Medien-/
          Missionstypen, Authentifizierung, MinIO/S3, Geodaten- und Luftlageintegration.
          Die vorhandene Web-App referenziert den OpenFlightHub TypeScript-API-Client
          unter vendor/openflighthub/api-client-sdk-typescript; die API definiert die
          OpenAPI-Spezifikation unter openapi_spec.yaml. Die DB-Entitäten wurden
          separat unter services/database/upstream/schema.dbml importiert.
          
          ## Sicherheits- und Betriebsgrenzen
          
          - Keine LICENSE-Datei im Originalarchiv. Wiederverwendungsrechte am
            Gesamtprojekt sind ungeklärt; vor Merge/Weitergabe klären.
          - Das originale README zeigt Beispielpasswörter und API-/Cloud-Schlüssel.
            NICHT unverändert verwenden. secrets.json darf nicht eingecheckt werden.
          - Originale Docker-/Deployment-Skripte können Container ersetzen, Dateien
            entfernen und aktiv Ports veröffentlichen. Sie liegen nur als
            unveränderter Quell-Snapshot unter services/api/upstream.
            Der verschachtelte GitHub-Workflow wird nicht ausgeführt.
          - Ein Start von src/launch.ts öffnet HTTP- und MQTT-Listener und aktiviert
            den DJI-Connector. Dies wird bewusst nicht automatisiert und ist
            nicht als read-only nachgewiesen. Keine Live-Geräte verbinden.
          - Der ursprüngliche API-Server benötigt eine schreibfähige DB-Rolle,
            separate Auth-/Mail-/MinIO-/Terrain-Konfiguration und Dienste.
            Die isolierte DB-Laborinstanz enthält bewusst KEINEN solchen Account.
          - Kein produktiver Test, kein Datenbank-Upgrade, kein DJI-Hardwaretest und
            keine Erlaubnis zur Flugsteuerung. Der Snapshot belegt nur den Quellimport.
          
          ## Prüfung
          
          Die GitHub-Action verify-api.yml prüft Git-Tree/Kopierintegrität und
          TypeScript-Build ohne Start des Servers, Container-Deployment, Secrets oder
          aktive Netzwerkkontakte zu DJI/Endgeräten. Die bestehende Web-App/DB
          wurde durch diesen Import nicht verändert.
          
          ## Nächste Umsetzung
          
          1. Rechte für Web-App, Datenbank und API verbindlich klären.
          2. Authentifizierungs-/RBAC- und API-Datenmodelle gegeneinander prüfen.
          3. Eigenen, standardmäßig inaktiven API-Adapter für das lokale DB-Labor
             und Web-App-Konfiguration mit explizitem Offline-/Read-only-Modus bauen.
          4. DB-Migrationen, Isolation, Secret-Management, Replay- und Geräte-Testfälle
             nachweisbar verifizieren.
          5. Aktive DJI-MQTT-Befehle, Schreib- und DRC-Operationen standardmäßig
             sperren, bevor eine Verbindung zur realen Hardware erlaubt wird.
          """,encoding="utf-8")
          readme=Path("README.md")
          t=readme.read_text(encoding="utf-8")
          t=t.replace(
          "Die vom Nutzer bereitgestellten OpenFlightHub-Snapshots für Web-App und Datenbank wurden unter apps/web-app/ und services/database/upstream/ importiert. Für beide Archive ist keine umfassende Wiederverwendungslizenz nachgewiesen; Weitergabe und Merge in main erfordern eine Rechteprüfung. Das Backend fehlt weiterhin; dies ist keine einsatzfähige Bodenstation.",
          "Die vom Nutzer bereitgestellten OpenFlightHub-Snapshots für Web-App, Datenbank und API liegen unter apps/web-app/, services/database/upstream/ und services/api/upstream/. Für diese drei Archive ist keine umfassende Wiederverwendungslizenz nachgewiesen. Weitergabe und Merge in main erfordern eine Rechteprüfung. Die Komponenten sind noch nicht als sicherer, lauffähiger Gesamtdienst integriert; dies ist keine einsatzfähige Bodenstation.")
          t=t.replace(
          "- services/database/upstream/: byteidentisches OpenFlightHub-Datenbankarchiv aus der ZIP. Dienste und Original-Skripte werden nicht ausgeführt; siehe docs/database-import.md. Optionales isoliertes PostGIS-Labor unter services/database/compose.lab.yml.",
          "- services/database/upstream/: byteidentisches OpenFlightHub-Datenbankarchiv aus der ZIP. Dienste und Original-Skripte werden nicht ausgeführt; siehe docs/database-import.md. Optionales isoliertes PostGIS-Labor unter services/database/compose.lab.yml.\n- services/api/upstream/: unveränderter Express-/TypeScript-API-Quellsnapshot aus der ZIP; keine automatische Ausführung von MQTT, aktiven DJI-Operationen, Datenbankwrites oder Deploy-Skripten; siehe docs/api-import.md.",1)
          t=t.replace(
          "Für die auf ausdrücklichen Wunsch importierten Web-App- und Datenbank-Snapshots sind die Rechte weiterhin ungeklärt;",
          "Für die auf ausdrücklichen Wunsch importierten Web-App-, Datenbank- und API-Snapshots sind die Rechte weiterhin ungeklärt;",1)
          t=t.replace(
          "Rechte an apps/web-app/ und services/database/upstream/ klären",
          "Rechte an apps/web-app/, services/database/upstream/ und services/api/upstream/ klären",1)
          readme.write_text(t,encoding="utf-8")
          architecture=Path("docs/architecture.md")
          t=architecture.read_text(encoding="utf-8")
          t=t.replace(
          "Separat importierte Quell-Snapshots (Web-App und Datenbank) sind",
          "Separat importierte Quell-Snapshots (Web-App, Datenbank und API) sind",1)
          t=t.replace(
          "ein Quellarchiv, ein isoliertes Datenbank-Testlabor und ein Entwurf",
          "ein Quellarchiv mit Web-App/API, ein isoliertes Datenbank-Testlabor und ein Entwurf",1)
          architecture.write_text(t,encoding="utf-8")
          print(f"PASS: {count} files / {total} bytes, exact tree {tree}")
          PY
          rm .github/workflows/import-openflighthub-api-once.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --quiet && { echo "No changes"; exit 1; }
          git commit -m "Import exact OpenFlightHub API ZIP snapshot with security documentation"
          git push origin HEAD:refs/heads/feat/import-openflighthub-web-app-20261108
