name: Verify DroneTerminal isolated web transport
on:
  push:
    branches:
      - main
      - feat/import-openflighthub-web-app-20261108
    paths:
      - 'apps/web-app/src/api/**'
      - 'scripts/tests/web-transport-smoke.test.mjs'
      - 'scripts/tests/register-ts-resolution.mjs'
      - '.github/workflows/verify-web-transport.yml'
  pull_request:
    paths:
      - 'apps/web-app/src/api/**'
      - 'scripts/tests/web-transport-smoke.test.mjs'
      - 'scripts/tests/register-ts-resolution.mjs'
      - '.github/workflows/verify-web-transport.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  transport:
    name: REST / native WS / multipart localhost-only
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Verify transport test syntax and run isolated loopback smoke
        run: |
          node --check scripts/tests/web-transport-smoke.test.mjs
          node --experimental-strip-types --import ./scripts/tests/register-ts-resolution.mjs --test scripts/tests/web-transport-smoke.test.mjs
      - name: Verify imported SDK and backend source remain unchanged
        run: |
          git diff --exit-code -- vendor/openflighthub/api-client-sdk-typescript/ services/api/upstream/ services/database/upstream/
          test -z "$(git status --porcelain -- vendor/openflighthub/api-client-sdk-typescript/ services/api/upstream/ services/database/upstream/)"
