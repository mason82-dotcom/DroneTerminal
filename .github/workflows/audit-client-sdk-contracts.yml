name: Audit API client SDK contracts
on:
  push:
    branches:
      - main
      - feat/import-openflighthub-web-app-20261108
    paths:
      - 'scripts/audit-client-sdk-contracts.cjs'
      - 'scripts/test-client-sdk-contracts.cjs'
      - '.github/workflows/audit-client-sdk-contracts.yml'
      - 'services/api/upstream/openapi_spec.yaml'
      - 'services/api/upstream/src/live-websocket/definitions/**'
      - 'vendor/openflighthub/api-client-sdk-typescript/**'
      - 'apps/web-app/package-lock.json'
  pull_request:
    paths:
      - 'scripts/audit-client-sdk-contracts.cjs'
      - 'scripts/test-client-sdk-contracts.cjs'
      - '.github/workflows/audit-client-sdk-contracts.yml'
      - 'services/api/upstream/openapi_spec.yaml'
      - 'services/api/upstream/src/live-websocket/definitions/**'
      - 'vendor/openflighthub/api-client-sdk-typescript/**'
      - 'apps/web-app/package-lock.json'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  contract:
    name: REST operations / WebSocket types / SDK lockfile
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check Node script syntax
        run: |
          node --check scripts/audit-client-sdk-contracts.cjs
          node --check scripts/test-client-sdk-contracts.cjs
      - name: Negative and positive contract-auditor tests
        run: node --test scripts/test-client-sdk-contracts.cjs
      - name: Verify real SDK and API source contracts without starting services
        shell: bash
        run: |
          set -euo pipefail
          node scripts/audit-client-sdk-contracts.cjs --report "$RUNNER_TEMP/sdk-contract-report.json"
      - name: Ensure source files remained unchanged
        run: |
          git diff --exit-code -- services/api/upstream/ vendor/openflighthub/api-client-sdk-typescript/ apps/web-app/
          test -z "$(git status --porcelain -- services/api/upstream/ vendor/openflighthub/api-client-sdk-typescript/ apps/web-app/)"
      - name: Preserve SDK compatibility evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: droneterminal-sdk-contract-report
          path: ${{ runner.temp }}/sdk-contract-report.json
          if-no-files-found: warn
          retention-days: 14
