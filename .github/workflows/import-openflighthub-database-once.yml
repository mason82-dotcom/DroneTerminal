name: One-time OpenFlightHub database import
on:
  push:
    branches:
      - feat/import-openflighthub-web-app-20261108
    paths:
      - .github/workflows/import-openflighthub-database-once.yml
permissions:
  contents: write
jobs:
  import:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Import exact database archive, document and remove bootstrap
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --location --silent --show-error --retry 3 \
            "https://api.github.com/repos/OpenFlightHub/database/zipball/727f1f74ab553c65311f5727e9d304be0c975ad5" \
            --output "$RUNNER_TEMP/openflighthub-database.zip"
          python3 - <<'PY'
          import os, shutil, subprocess, zipfile
          from pathlib import Path, PurePosixPath
          archive=Path(os.environ["RUNNER_TEMP"])/"openflighthub-database.zip"
          source=Path(os.environ["RUNNER_TEMP"])/"database-source-verified"
          dest=Path("services/database/upstream")
          source.mkdir(parents=True,exist_ok=False)
          count=total=0
          with zipfile.ZipFile(archive) as z:
              for entry in z.infolist():
                  if entry.is_dir(): continue
                  parts=PurePosixPath(entry.filename).parts
                  if len(parts)<2 or any(p in ("", ".", "..") for p in parts):
                      raise RuntimeError("Unexpected ZIP path: "+entry.filename)
                  if (entry.external_attr>>16)&0o170000 not in (0,0o100000):
                      raise RuntimeError("Unexpected ZIP entry mode: "+entry.filename)
                  target=source.joinpath(*parts[1:])
                  target.parent.mkdir(parents=True,exist_ok=True)
                  target.write_bytes(z.read(entry))
                  count+=1
                  total+=entry.file_size
          if (count,total)!=(17,8061861):
              raise RuntimeError(f"Unexpected archive inventory: {count} files; {total} bytes")
          subprocess.run(["git","init","-q",str(source)],check=True)
          subprocess.run(["git","-C",str(source),"add","-A"],check=True)
          tree=subprocess.check_output(["git","-C",str(source),"write-tree"],text=True).strip()
          if tree!="111486dd0fe0e3f7e127b9d44eba48951a4ad318":
              raise RuntimeError("ZIP differs from user-supplied verified source; got "+tree)
          shutil.rmtree(source/".git")
          if dest.exists(): raise RuntimeError("Import target exists")
          dest.parent.mkdir(parents=True,exist_ok=True)
          shutil.copytree(source,dest)
          Path("docs/database-import.md").write_text("""# Datenbank-Import: OpenFlightHub zu DroneTerminal
          
          ## Reproduzierbarkeit
          
          - Nutzereingabe: database-master.zip
          - Upstream: https://github.com/OpenFlightHub/database
          - Fixierter Commit: 727f1f74ab553c65311f5727e9d304be0c975ad5
          - Original-Git-Tree: 111486dd0fe0e3f7e127b9d44eba48951a4ad318
          - Import: services/database/upstream
          - Inventar: 17 Dateien, 8.061.861 Byte (davon drei Beispielbilder)
          - Abgleich: Inhalte, Unterverzeichnisse und Dateimodi im Git-Tree identisch
          - Der vorhandene Vendor-Bestand und die Web-App wurden nicht verändert.
          
          ## Technischer Umfang
          
          PostgreSQL/PostGIS-Schema mit 23 Fach-Tabellen:
          Benutzer, Teams, Organisationen, Workspaces, Geräte/Controller, Verbindungen,
          Flüge/Telemetrie, Medien, Geometrie, Missionen, Aufgaben und Sharing.
          schema.dbml dokumentiert die Entitäten; 3_setup_triggers.sql ist leer.
          
          ## Sicherheitsbefunde
          
          - Kein LICENSE-File: Keine Wiederverwendungsrechte am Gesamtprojekt verifiziert.
            Nur wait-for.sh trägt einen eingebetteten MIT-Lizenzhinweis für dieses Skript.
          - build_and_run_docker.sh und die ursprünglichen verschachtelten GitHub
            Workflows enthalten destruktive Befehle (Container/Volumes/Dateien löschen).
            Diese dürfen weder automatisch noch auf Produktivhosts ausgeführt werden.
          - 2_init_users_and_permissions.sql enthält ein festes API-Rollenpasswort;
            X_fill_with_example_data.sql enthält voreingestellte Demo-Accounts,
            Session- und Verbindungstokens. Nicht für produktive Deployments nutzen.
          - SQL-Dateien bilden einen Initial-Snapshot, kein inkrementelles
            Migrationssystem. Bestehende Datenbanken niemals direkt initialisieren.
          - Kein Backend/DB-Adapter und keine Authentifizierungsintegration vorhanden.
            DJI-Hardware wurde nicht getestet; es gibt keine Flugsteuerungsfreigabe.
          
          ## Sicheres, optionales Schema-Labor
          
          services/database/compose.lab.yml startet einen getrennten PostGIS-Container
          mit eigenem benannten Volume, ohne veröffentlichte Host-Ports. Automatisch
          werden NUR 0_init_database.sql und 1_init_tables.sql in ein neu angelegtes
          Testvolume eingespielt; kein Demo-Seed, keine API-Rolle und kein Übernehmen
          oder Löschen einer bestehenden produktiven Datenbank. Die GitHub-CI prüft
          das Laborschema in einem isolierten Runner und entfernt nur dessen
          temporäres Volume.
          
          Vor produktiver Nutzung erforderlich: Lizenzstatus, Migrationen/Backups,
          Rollen/Secrets, Mandantentrennung, API-Verträge und Systemtests.
          """,encoding="utf-8")
          readme=Path("README.md")
          text=readme.read_text(encoding="utf-8")
          text=text.replace(
          "> **Wichtig:** Der ausdrücklich angeforderte Web-App-Snapshot liegt unter apps/web-app/. Das Archiv enthält keine Wiederverwendungslizenz. Die Weitergabe und der Merge in main erfordern eine Rechteprüfung. Das zugehörige Backend fehlt; dies ist keine einsatzfähige Bodenstation.",
          "> **Wichtig:** Die vom Nutzer bereitgestellten OpenFlightHub-Snapshots für Web-App und Datenbank wurden unter apps/web-app/ und services/database/upstream/ importiert. Für beide Archive ist keine umfassende Wiederverwendungslizenz nachgewiesen; Weitergabe und Merge in main erfordern eine Rechteprüfung. Das Backend fehlt weiterhin; dies ist keine einsatzfähige Bodenstation.")
          text=text.replace(
          "- apps/web-app/: unveränderter Vue-/TypeScript-Web-App-Quellsnapshot aus der ZIP; siehe docs/web-app-import.md.",
          "- apps/web-app/: unveränderter Vue-/TypeScript-Web-App-Quellsnapshot aus der ZIP; siehe docs/web-app-import.md.\n- services/database/upstream/: byteidentisches OpenFlightHub-Datenbankarchiv aus der ZIP. Dienste und Original-Skripte werden nicht ausgeführt; siehe docs/database-import.md. Optionales isoliertes PostGIS-Labor unter services/database/compose.lab.yml.",
          1)
          text=text.replace(
          "Für die auf ausdrücklichen Wunsch importierte Web-App sind die Rechte weiterhin ungeklärt;",
          "Für die auf ausdrücklichen Wunsch importierten Web-App- und Datenbank-Snapshots sind die Rechte weiterhin ungeklärt;",1)
          text=text.replace(
          "1. Vor Merge und Weitergabe die Rechte an apps/web-app/ klären oder die UI eigenständig neu entwickeln.",
          "1. Vor Merge und Weitergabe Rechte an apps/web-app/ und services/database/upstream/ klären oder die fehlenden Komponenten eigenständig neu entwickeln.",1)
          readme.write_text(text,encoding="utf-8")
          architecture=Path("docs/architecture.md")
          t=architecture.read_text(encoding="utf-8")
          t=t.replace(
          "Diese Planung ist ein eigener Entwurf. Sie enthält **keinen** nicht lizenzierten OpenFlightHub-Code.",
          "Die Architekturplanung ist ein eigenständiger Entwurf. Separat importierte Quell-Snapshots (Web-App und Datenbank) sind **nicht** als freigegebene, produktiv verwendbare Komponenten zu verstehen; ihre Wiederverwendungsrechte sind ungeklärt.",1)
          t=t.replace(
          "Der vorliegende Repo-Stand ist **nur ein Quellarchiv plus Entwurf**",
          "Der vorliegende Repo-Stand ist **ein Quellarchiv, ein isoliertes Datenbank-Testlabor und ein Entwurf**",1)
          architecture.write_text(t,encoding="utf-8")
          print(f"PASS: {count} files and {total} bytes, exact tree {tree}")
          PY
          rm .github/workflows/import-openflighthub-database-once.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --quiet && { echo "No changes"; exit 1; }
          git commit -m "Import exact OpenFlightHub database ZIP snapshot with safety documentation"
          git push origin HEAD:refs/heads/feat/import-openflighthub-web-app-20261108
