name: Verify imported MIT packages
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  verify-vendor:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify source inventory and licenses
        run: node scripts/verify-vendor.mjs
